name: Validate feature pipeline

on:
  push:
    paths: ['etl/**', 'tests/**', 'supabase/**', '.github/workflows/tests.yml', 'requirements-etl.txt']
  pull_request:
    paths: ['etl/**', 'tests/**', 'supabase/**', '.github/workflows/tests.yml', 'requirements-etl.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - run: pip install -r requirements-etl.txt
      - run: python -m unittest discover -s tests -v
